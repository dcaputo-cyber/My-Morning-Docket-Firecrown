name: Voice Samples (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate voice samples
        run: |
          mkdir -p voice-samples
          python voice_samples_gen.py

      - name: Commit samples
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f voice-samples/

          if git diff --cached --quiet; then
            echo "No sample files to commit."
            exit 0
          fi

          git commit -m "Temporary voice samples for review"
          git push origin "HEAD:main"
